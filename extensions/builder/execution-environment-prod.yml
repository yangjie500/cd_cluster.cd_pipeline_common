---
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-26/ee-supported-rhel9:2.0

dependencies:
  galaxy: requirements.yml
  python:
  system:
    - python3-pip
    - python3-devel
    - gcc
    - systemd-devel
    - libxml2-devel
    - libcurl-devel

additional_build_steps:
  append_base:
    - RUN python3 -m pip install --upgrade pip setuptools wheel

options:
  package_manager_path: /usr/bin/microdnf
