- name: "Converge (Success: Push image using Cosign binary to Gitlab Registry)"
  hosts: instance
  gather_facts: true
  tasks:
    - name: Locate the index.json file
      ansible.builtin.find:
        paths: "/tmp/redis" # The base directory the tar is extracted
        patterns: "index.json"
        recurse: true
      register: found_files

    - name: Set parent directory as a fact
      ansible.builtin.set_fact:
        oci_root_path: "{{ found_files.files[0].path | dirname }}"
      when: found_files.matched > 0

    - name: Debug the OCI root path
      ansible.builtin.debug:
        msg: "The OCI parent folder is {{ oci_root_path }}"

    - name: Test Push Container Images
      ansible.builtin.include_role:
        name: "push_image_to_registry_cosign"
      vars:
        push_image_to_registry_cosign_src: "{{ oci_root_path }}"
        push_image_to_registry_cosign_registry_url: "{{ push_image_to_registry_cosign_var_registry_url }}"
        push_image_to_registry_cosign_registry_login_url: "registry.gitlab.com"
        push_image_to_registry_cosign_registry_username: "test_user"
        push_image_to_registry_cosign_registry_password: "{{ push_image_to_registry_cosign_secret_registry_token }}"
        push_image_to_registry_cosign_image_name: "my-redis"
        push_image_to_registry_cosign_image_tag: "1.1.0"
        push_image_to_registry_cosign_ssl_verify: true

- name: "Verify (Success: Push image using Cosign binary to Gitlab Registry)"
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify image existence via cosign tree
      ansible.builtin.command:
        cmd: >-
          cosign tree
          {{ push_image_to_registry_cosign_var_registry_url }}/my-redis:1.1.0
      register: push_image_to_registry_cosign_tree_result
      changed_when: false

    - name: "[Cleanup] Delete the pushed image from the registry"
      # yamllint disable rule:line-length
      ansible.builtin.uri:
        url: "https://gitlab.com/api/v4/projects/81950682/registry/repositories/11413232/tags/1.1.0"
        method: DELETE
        headers:
          PRIVATE-TOKEN: "{{ push_image_to_registry_cosign_secret_registry_token }}"
        status_code: [200]
        validate_certs: true

