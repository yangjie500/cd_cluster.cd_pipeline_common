- name: "Converge (Failure: Not a git repo)"
  hosts: instance
  gather_facts: true
  tasks:
    - name: Run selected role
      block:
        - name: Create a directory if it does not exist
          ansible.builtin.file:
            path: "/tmp/not_repo"
            state: directory
            mode: "0755"

        - name: Run push role
          ansible.builtin.include_role:
            name: gitlab_push_repository
          vars:
            gitlab_push_repository_src_path: "/tmp/not_repo"
            gitlab_push_repository_branch: "main"
            gitlab_push_repository_tag: ""
            gitlab_push_repository_message: "Ansible automated update"
            gitlab_push_repository_url: "{{ gitlab_push_repository_var_repo_url }}"
            gitlab_push_repository_verify_remote_server: true
            gitlab_push_repository_token_user: "oauth2"
            gitlab_push_repository_token: "{{ gitlab_push_repository_secret_pat }}"
          register: fail_role

      rescue:
        - name: Assert that the role threw an error
          ansible.builtin.assert:
            that:
              - gitlab_push_repository_role_output.failure_category == "not_git_repo"
            fail_msg: "The test did not trap the expected role failure."
