---
- name: "[INFO] Role Configuration: push_image_to_registry_cosign"
  ansible.builtin.debug:
    msg:
      - "Source: {{ push_image_to_registry_cosign_src | default('UNDEFINED', true) }}"
      - "Image Name: {{ push_image_to_registry_cosign_image_name | default('UNDEFINED', true) }}"
      - "Image Tag: {{ push_image_to_registry_cosign_image_tag | default('UNDEFINED', true) }}"
      - "Registry Login URL: {{ push_image_to_registry_cosign_registry_login_url | default('UNDEFINED', true) }}"
      - "Registry Push URL: {{ push_image_to_registry_cosign_registry_url | default('UNDEFINED', true) }}"
      - "Username: {{ push_image_to_registry_cosign_registry_username | default('UNDEFINED', true) }}"
      - "SSL Verify: {{ push_image_to_registry_cosign_ssl_verify | default('UNDEFINED') }}"
      - "Password: {{ '[MASKED]' if (push_image_to_registry_cosign_registry_password | default('', true)) != '' else 'UNDEFINED' }}"

- name: "[INFO] Sanitize input variables (set defaults for UNDEFINED strings)"
  ansible.builtin.set_fact:
    push_image_to_registry_cosign_src: "{{ push_image_to_registry_cosign_src | default('', true) }}"
    push_image_to_registry_cosign_image_name: "{{ push_image_to_registry_cosign_image_name | default('', true) }}"
    push_image_to_registry_cosign_image_tag: "{{ push_image_to_registry_cosign_image_tag | default('', true) }}"
    push_image_to_registry_cosign_registry_login_url: "{{ push_image_to_registry_cosign_registry_login_url | default('', true) }}"
    push_image_to_registry_cosign_registry_url: "{{ push_image_to_registry_cosign_registry_url | default('', true) }}"
    push_image_to_registry_cosign_registry_username: "{{ push_image_to_registry_cosign_registry_username | default('', true) }}"
    push_image_to_registry_cosign_registry_password: "{{ push_image_to_registry_cosign_registry_password | default('', true) }}"
    push_image_to_registry_cosign_ssl_verify: "{{ push_image_to_registry_cosign_ssl_verify | default(false) }}"

- name: "[INFO] Initialize role tracking variables"
  ansible.builtin.set_fact:
    push_image_to_registry_cosign_tracked_files_modified: []
    push_image_to_registry_cosign_tracked_files_deleted: []
    push_image_to_registry_cosign_tracked_files_created: []
    push_image_to_registry_cosign_tracked_custom_facts: {}
    push_image_to_registry_cosign_failure_message: ""
    push_image_to_registry_cosign_failure_category: ""

- name: Manage Cosign Push
  block:
    - name: Login to Cosign Registry
      ansible.builtin.command:
        cmd: >-
          cosign login {{ push_image_to_registry_cosign_registry_login_url }}
          -u {{ push_image_to_registry_cosign_registry_username }}
          --password-stdin
        stdin: "{{ push_image_to_registry_cosign_registry_password }}"
      register: push_image_to_registry_cosign_cosign_login_result
      changed_when: push_image_to_registry_cosign_cosign_login_result.rc == 0
      no_log: true

    - name: Push (Load) image to registry
      # yamllint disable rule:line-length
      ansible.builtin.command:
        cmd: >-
          cosign load
          --allow-insecure-registry={{ not (push_image_to_registry_cosign_ssl_verify | bool) | lower }}
          --dir={{ push_image_to_registry_cosign_src }}
          {{ push_image_to_registry_cosign_registry_url }}{% if push_image_to_registry_cosign_image_name | length > 0 %}/{{ push_image_to_registry_cosign_image_name }}{% endif %}:{{ push_image_to_registry_cosign_image_tag }}
      register: push_image_to_registry_cosign_cosign_push_result
      changed_when: push_image_to_registry_cosign_cosign_push_result.rc == 0
      retries: 5
      delay: 15
      until: >
        push_image_to_registry_cosign_cosign_push_result.rc == 0 or
        (
          'unauthorized' in (push_image_to_registry_cosign_cosign_push_result.stderr | lower) or
          'authentication' in (push_image_to_registry_cosign_cosign_push_result.stderr | lower) or
          'no such file' in (push_image_to_registry_cosign_cosign_push_result.stderr | lower) or
          'directory' in (push_image_to_registry_cosign_cosign_push_result.stderr | lower)
        )
      failed_when: push_image_to_registry_cosign_cosign_push_result.rc != 0

    - name: "[INFO] Update custom facts with operation output"
      ansible.builtin.set_fact:
        push_image_to_registry_cosign_tracked_custom_facts:
          cosign_login:
            output: "{{ push_image_to_registry_cosign_cosign_login_result.stdout }}"
            error: "{{ push_image_to_registry_cosign_cosign_login_result.stderr }}"
          cosign_push:
            output: "{{ push_image_to_registry_cosign_cosign_push_result.stdout }}"
            error: "{{ push_image_to_registry_cosign_cosign_push_result.stderr }}"

  rescue:
    - name: "[ERROR] Record the exact task failure stderr"
      ansible.builtin.set_fact:
        push_image_to_registry_cosign_failure_message: >-
          {{
            ansible_failed_result.stderr | default(None) or
            ansible_failed_result.stdout | default(None) or
            ansible_failed_result.msg | default('An unknown error occurred.')
          }}

    - name: "[ERROR] Identify the specific failure type"
      ansible.builtin.set_fact:
        push_image_to_registry_cosign_failure_category: >-
          {%- set msg = push_image_to_registry_cosign_failure_message.lower() -%}
          {%- if 'unauthorized' in msg or 'authentication' in msg -%}
            bad_credentials
          {%- elif 'connection refused' in msg or 'no such host' in msg -%}
            network_issue
          {%- elif 'no such file' in msg or 'directory' in msg -%}
            missing_source
          {%- else -%}
            unclassified_error
          {%- endif -%}

    - name: "[ERROR] Fail the task"
      ansible.builtin.fail:
        msg: "The role failed because the Cosign operation was unsuccessful."

  always:
    - name: "[INFO] Ensure registry credential is deleted"
      ansible.builtin.file:
        path: "~/.docker/config.json"
        state: absent

    - name: "[INFO] Add deleted files to parent tracking list"
      ansible.builtin.set_fact:
        push_image_to_registry_cosign_tracked_files_deleted: >-
          {{
            push_image_to_registry_cosign_tracked_files_deleted | default([]) + ['~/.docker/config.json']
          }}

    - name: "[INFO] Construct the Generic Role Output Object"
      ansible.builtin.set_fact:
        push_image_to_registry_cosign_role_output:
          role_name: "push_image_to_registry_cosign"
          failure_message: "{{ push_image_to_registry_cosign_failure_message }}"
          failure_category: "{{ push_image_to_registry_cosign_failure_category }}"
          files:
            modified: "{{ push_image_to_registry_cosign_tracked_files_modified }}"
            deleted: "{{ push_image_to_registry_cosign_tracked_files_deleted }}"
            created: "{{ push_image_to_registry_cosign_tracked_files_created }}"
          variables: "{{ push_image_to_registry_cosign_tracked_custom_facts }}"

    - name: "[INFO] Print the generic output object"
      ansible.builtin.debug:
        var: push_image_to_registry_cosign_role_output
