---
- name: "[INFO] Role Configuration: verify_signature_cosign"
  ansible.builtin.debug:
    msg:
      - "Blob File Path: {{ verify_signature_cosign_blob_file_path | default('UNDEFINED', true) }}"
      - "Signature File Path: {{ verify_signature_cosign_sig_file_path | default('UNDEFINED', true) }}"
      - "Public Key File Path: {{ verify_signature_cosign_pub_key_file_path | default('UNDEFINED', true) }}"

- name: "[INFO] Sanitize input variables (set defaults for UNDEFINED strings)"
  ansible.builtin.set_fact:
    verify_signature_cosign_blob_file_path: "{{ verify_signature_cosign_blob_file_path | default('', true) | trim }}"
    verify_signature_cosign_sig_file_path: "{{ verify_signature_cosign_sig_file_path | default('', true) | trim }}"
    verify_signature_cosign_pub_key_file_path: "{{ verify_signature_cosign_pub_key_file_path | default('', true) | trim }}"

- name: "[INFO] Initialize role tracking variables"
  ansible.builtin.set_fact:
    verify_signature_cosign_tracked_files_modified: []
    verify_signature_cosign_tracked_files_deleted: []
    verify_signature_cosign_tracked_files_created: []
    verify_signature_cosign_tracked_custom_facts: {}
    verify_signature_cosign_failure_message: ""
    verify_signature_cosign_failure_category: ""

- name: Manage Cosign Signature Verification
  block:
    - name: Execute Cosign Blob Verification Command
      ansible.builtin.command:
        cmd: >-
          cosign verify-blob
          --key "{{ verify_signature_cosign_pub_key_file_path }}"
          --signature "{{ verify_signature_cosign_sig_file_path }}"
          "{{ verify_signature_cosign_blob_file_path }}"
          --insecure-ignore-tlog
      register: verify_signature_cosign_exec_result
      changed_when: false

    - name: "[INFO] Update custom facts with operation output"
      ansible.builtin.set_fact:
        verify_signature_cosign_tracked_custom_facts:
          verification_status: "verified"
          cosign_output: "{{ verify_signature_cosign_exec_result.stdout | default('') }}"

  rescue:
    - name: "[ERROR] Record the exact task failure stderr"
      ansible.builtin.set_fact:
        verify_signature_cosign_failure_message: >-
          {{
            ansible_failed_result.stderr | default(None) or
            ansible_failed_result.stdout | default(None) or
            ansible_failed_result.msg | default('An unknown cosign error occurred.')
          }}

    - name: "[ERROR] Identify the specific failure type"
      ansible.builtin.set_fact:
        verify_signature_cosign_failure_category: >-
          {%- set msg = verify_signature_cosign_failure_message.lower() -%}
          {%- if 'no such file' in msg or 'directory' in msg -%}
            missing_source_files
          {%- elif 'invalid signature' in msg or 'verification failed' in msg -%}
            signature_mismatch
          {%- elif 'error option' in msg or 'unknown flag' in msg or 'command not found' in msg -%}
            cosign_binary_issue
          {%- else -%}
            unclassified_error
          {%- endif -%}

    - name: "[ERROR] Fail the task"
      ansible.builtin.fail:
        msg: "The role failed because the Cosign verification operation was unsuccessful."

  always:
    - name: "[INFO] Construct the Generic Role Output Object"
      ansible.builtin.set_fact:
        verify_signature_cosign_role_output:
          role_name: "verify_signature_cosign"
          failure_message: "{{ verify_signature_cosign_failure_message }}"
          failure_category: "{{ verify_signature_cosign_failure_category }}"
          files:
            modified: "{{ verify_signature_cosign_tracked_files_modified }}"
            deleted: "{{ verify_signature_cosign_tracked_files_deleted }}"
            created: "{{ verify_signature_cosign_tracked_files_created }}"
          variables: "{{ verify_signature_cosign_tracked_custom_facts }}"

    - name: "[INFO] Print the generic output object"
      ansible.builtin.debug:
        var: verify_signature_cosign_role_output
