---
minor_changes:
  - Added the `parse_structured_filename` module to extract structured key-value metadata from delimited filename strings.
  - Added support for stripping common single-part and multi-part file extensions before parsing structured filenames.
  - Added strict field-to-key validation to fail when extracted filename fields do not match the provided key list.

doc_changes:
  - Documented `parse_structured_filename` module options, examples, and return values.
