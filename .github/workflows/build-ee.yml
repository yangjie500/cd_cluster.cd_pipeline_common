name: Build Execution Environment

on:
  push:
    branches:
      - feat/build-execution-environment
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  EE_FILE: extensions/builder/execution-environment.yml
  EE_CONTEXT: context
  COLLECTION_PATH: collections/ansible_collections/cd_cluster/pipeline_common
  COLLECTION_TARBALL: dist/project-custom_collection.tar.gz
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/my-ee

jobs:
  build-ee:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Ansible build tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-builder ansible-runner

      - name: Build custom collection artifact
        run: |
          mkdir -p dist

          ansible-galaxy collection build . \
            --output-path dist

          BUILT_COLLECTION="$(ls dist/*.tar.gz | head -n 1)"

          mv "$BUILT_COLLECTION" dist/project-custom-collection.tar.gz

