name: Build Execution Environment

on:
  push:
    branches:
      - feat/build-execution-environment
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  EE_FILE: extensions/builder/execution-environment.yml
  EE_CONTEXT: context
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cd-cluster-ee

jobs:
  build-ee:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Ansible build tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-builder ansible-runner

      - name: Build custom collection artifact
        run: |
          mkdir -p dist

          ansible-galaxy collection build . \
            --output-path dist

          BUILT_COLLECTION="$(ls dist/*.tar.gz | head -n 1)"

          mv "$BUILT_COLLECTION" dist/project-custom-collection.tar.gz

      - name: Extract collection version
        run: |
          COLLECTION_VERSION=$(yq -r '.version' "$COLLECTION_PATH/galaxy.yml")
          echo "COLLECTION_VERSION=$COLLECTION_VERSION" >> $GITHUB_ENV
          echo "Collection version: $COLLECTION_VERSION"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build execution environment
        run: |
          BUILDKIT_PROGRESS=plain ansible-builder build -v 5 \
            --file "$EE_FILE" \
            --tag "$IMAGE_NAME:${COLLECTION_VERSION}"

      - name: Test execution environment
        run: |
          docker run --rm "$IMAGE_NAME:${COLLECTION_VERSION}" ansible --version
          docker run --rm "$IMAGE_NAME:${COLLECTION_VERSION}" ansible-galaxy collection list
          docker run --rm "$IMAGE_NAME:${COLLECTION_VERSION}" python3.12 -m pip list

      # - name: Push execution environment
      #   if: github.ref == 'refs/heads/hello-branch'
      #   run: |
      #     docker push "$IMAGE_NAME:${{ github.sha }}"
      #     docker push "$IMAGE_NAME:hello-branch"
