name: Auto Tag Closed Release PR

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  auto-tag:
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      (
        github.event.pull_request.base.ref == 'main' ||
        github.event.pull_request.base.ref == 'feat/build-execution-environment'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract collection version
        run: |
          COLLECTION_VERSION=$(yq -r '.version' galaxy.yml)
          echo "COLLECTION_VERSION=$COLLECTION_VERSION" >> "$GITHUB_ENV"
          echo "Collection version: $COLLECTION_VERSION"

      - name: Check tag does not already exist
        run: |
          git fetch --tags

          if git rev-parse "v${COLLECTION_VERSION}" >/dev/null 2>&1; then
            echo "ERROR: Tag v${COLLECTION_VERSION} already exists"
            exit 1
          fi

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "v${COLLECTION_VERSION}"
          git push origin "v${COLLECTION_VERSION}"
