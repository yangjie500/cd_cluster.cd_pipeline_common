---
repos:
  - repo: https://github.com/ansible-network/collection_prep
    rev: 1.1.1
    hooks:
      - id: update-docs
        language_version: python3.9

  - repo: local
    hooks:
      - id: docsible
        name: Update Ansible Role Documentation
        # This shell loop finds every subdirectory in roles/ and runs docsible on it
        entry: bash -c 'for role in roles/*; do [ -d "$role" ] && docsible --role "$role" --no-backup --no-docsible; done'
        language: system
        # Trigger if any role's files change
        files: ^roles/.*/(tasks|defaults|meta|vars)/
        pass_filenames: false
        always_run: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace
        # Excludes README.md files specifically within the roles structure
        exclude: ^roles/.*README\.md$

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v3.0.0
    hooks:
      - id: add-trailing-comma

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.0.0"
    hooks:
      - id: prettier
        entry: env CI=1 bash -c "prettier --list-different . || ec=$? && prettier --loglevel=error --write . && exit $ec"
        pass_filenames: false
        args: []
        additional_dependencies:
          - prettier
          - prettier-plugin-toml

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: Sort import statements using isort
        args: ["--filter-files"]

  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8

  # - repo: https://github.com/adrienverge/yamllint
  #   rev: v1.35.1
  #   hooks:
  #     - id: yamllint

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.4.0
    hooks:
      - id: ansible-lint
        language_version: python3.12
        additional_dependencies:
          - ansible-core==2.20.4

  - repo: local
    hooks:
      - id: ansible-test-sanity
        name: Ansible test sanity
        entry: ansible-test sanity
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: python-unit-tests
        name: Python unit tests
        entry: python3 -m pytest ./tests/unit/
        language: system
        pass_filenames: false
